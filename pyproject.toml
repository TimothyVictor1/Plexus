[project]
name = "plexus"
version = "0.0.1"
description = "Plexus: an organisational nervous system with earned autonomy."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "asyncpg>=0.29",
  "neo4j>=5.23",
  "email-validator>=2.0",
  "temporalio>=1.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dashboard", ".venv", "scripts/fixtures", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ANN", "RUF", "TID"]
ignore = [
  "ANN401",  # Any is sometimes the honest type at boundaries
  "S101",    # assert is fine in tests; production code should not rely on it anyway
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
# Depends()/Query()/Body() in argument defaults is how FastAPI declares dependencies.
"api/**" = ["B008"]
"scripts/**" = ["S", "T201"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain".msg = "Agent loops are explicit Python (CLAUDE.md)."
"llama_index".msg = "Agent loops are explicit Python (CLAUDE.md)."
"crewai".msg = "Agent loops are explicit Python (CLAUDE.md)."

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["core", "adapters", "agents", "twin", "workflows", "api", "evals", "tests"]
exclude = ["dashboard/", "scripts/fixtures/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

# asyncpg ships no py.typed marker. Its surface is confined to core/db and core/pii/vault.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "integration: needs the compose stack (skipped unless PLEXUS_INTEGRATION=1)",
  "architecture: static rules that guard the non-negotiable principles",
]
