# Model role configuration. See specs/09-model-router.md.
#
# Separation of duties: the actor proposes, the verifier judges, and they must not be the same
# thing. With one vendor key available the verifier stays on the deterministic rule engine,
# which is a genuinely independent implementation rather than a second call to the same model.
# When a second vendor key exists, move the verifier onto it and delete this note.
separation: vendor

roles:
  actor:      { vendor: google, model: gemini-3.8-flash }
  workhorse:  { vendor: google, model: gemini-3.8-flash }
  classifier: { vendor: google, model: gemini-3.1-flash-lite }
  verifier:   { vendor: local,  model: policy-verifier }
  embedder:   { vendor: local,  model: bge-m3 }

profiles:
  # Nothing leaves the building. For customers who cannot send data to any vendor.
  sovereign:
    separation: model
    actor:      { vendor: local, model: policy-actor }
    verifier:   { vendor: local, model: policy-verifier }
    workhorse:  { vendor: local, model: policy-workhorse }
    classifier: { vendor: local, model: policy-classifier }
